<!doctype html><html lang="ru"><meta charset="utf-8"><style>
body{margin:0;background:#211a28;color:#eee5f3;font:14px system-ui}header{display:flex;gap:6px;align-items:center;padding:8px;flex-wrap:wrap}button{background:#44324f;color:#fff;border:1px solid #8c709e;border-radius:8px;padding:8px 12px;cursor:pointer}canvas{display:block;width:100%;height:400px;touch-action:none}#hint{padding:8px;min-height:36px;color:#d3c0df}button:focus-visible{outline:2px solid orange}</style>
<header><button id="plus" aria-label="Приблизить карту">＋</button><button id="minus" aria-label="Отдалить карту">−</button><button id="fit">Все участники</button><button id="pan">✋ Сдвиг поля</button></header><canvas aria-label="Свободная карта боя"></canvas><div id="hint"></div><div id="legend" style="padding:0 8px 10px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px"></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),hint=document.querySelector('#hint');let args={},scale=4,offset=[0,0],chosen=null,drag=null,pan=false,epoch='',width=600;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function world(p){return [(p[0]-offset[0])/scale,(offset[1]-p[1])/scale]}function screen(p){return [offset[0]+p[0]*scale,offset[1]-p[1]*scale]}function local(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function fit(){width=canvas.clientWidth;let ps=(args.actors||[]).map(a=>a.position);if(!ps.length)ps=[[0,0]];let region=args.mode==='area'?args.center:(args.actors||[]).find(a=>a.id===args.source)?.position;let rad=args.mode==='area'?args.radius:30;if(region&&rad)ps.push([region[0]-rad,region[1]-rad],[region[0]+rad,region[1]+rad]);let xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);let minX=Math.min(...xs)-15,maxX=Math.max(...xs)+15,minY=Math.min(...ys)-15,maxY=Math.max(...ys)+15;scale=Math.min(width/(maxX-minX),400/(maxY-minY));offset=[width/2-(minX+maxX)/2*scale,200+(minY+maxY)/2*scale];draw()}
function ring(p,r,color,fill){let s=screen(p);ctx.beginPath();ctx.arc(...s,r*scale,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke()}
function draw(){width=canvas.clientWidth;let d=devicePixelRatio||1;canvas.width=width*d;canvas.height=400*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#211a28';ctx.fillRect(0,0,width,400);let actor=(args.actors||[]).find(a=>a.id===args.source),dest=chosen||args.center;
if(actor&&args.mode==='move')ring(actor.position,30,'#91c5a6','#91c5a60c');if(dest&&args.radius)ring(dest,args.radius,'#ffb45e','#ff8f0033');
if(dest&&actor){let a=screen(actor.position),b=screen(dest),dist=Math.hypot(dest[0]-actor.position[0],dest[1]-actor.position[1]);ctx.strokeStyle=dist>30&&args.mode==='move'?'#ed7586':'#d7b9ed';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.fillText(dist.toFixed(1)+' м',(a[0]+b[0])/2+4,(a[1]+b[1])/2-7);ctx.beginPath();ctx.arc(...b,5,0,Math.PI*2);ctx.fill();hint.textContent=(args.mode==='area'?'Центр области':'Перемещение')+': '+dist.toFixed(1)+' м'+(args.mode==='move'&&dist>30?' · больше 30 м':'')}
else hint.textContent=pan?'Потяни поле для просмотра':'Потяни свою фигурку или коснись нужной точки';
(args.actors||[]).forEach((a,index)=>{let s=screen(a.id===args.source&&dest&&args.mode!=='area'?dest:a.position),hit=dest&&args.radius&&Math.hypot(a.position[0]-dest[0],a.position[1]-dest[1])<=args.radius;ctx.beginPath();ctx.arc(...s,14,0,Math.PI*2);ctx.fillStyle=a.enemy?'#d66c7f':'#91c5a6';ctx.fill();ctx.strokeStyle=hit?'#ffb45e':a.id===args.source?'#dcc0f3':'#4c3e55';ctx.lineWidth=hit||a.id===args.source?3:1;ctx.stroke();ctx.fillStyle='#1b1520';ctx.textAlign='center';ctx.fillText(String(index+1),s[0],s[1]+5);ctx.textAlign='left'});ctx.fillStyle='#b7a5c4';ctx.fillRect(12,382,10*scale,2);ctx.fillText('10 м',12,374)}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);let p=local(e);drag={p,offset:[...offset],pan};if(!pan){chosen=world(p);draw()}};
canvas.onpointermove=e=>{if(!drag)return;let p=local(e);if(drag.pan)offset=[drag.offset[0]+p[0]-drag.p[0],drag.offset[1]+p[1]-drag.p[1]];else chosen=world(p);draw()};
canvas.onpointerup=e=>{if(drag&&!drag.pan&&chosen)send('streamlit:setComponentValue',{value:{epoch:args.epoch,point:chosen},dataType:'json'});drag=null};canvas.onpointercancel=()=>drag=null;
function zoom(f){let p=world([width/2,200]);scale=Math.max(.1,Math.min(30,scale*f));offset=[width/2-p[0]*scale,200+p[1]*scale];draw()}
document.querySelector('#plus').onclick=()=>zoom(1.3);document.querySelector('#minus').onclick=()=>zoom(1/1.3);document.querySelector('#fit').onclick=fit;document.querySelector('#pan').onclick=()=>{pan=!pan;document.querySelector('#pan').textContent=pan?'✋ Сдвиг включён':'✋ Сдвиг поля';draw()};
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;if(epoch!==args.epoch){epoch=args.epoch;chosen=null;fit()}draw();let legend=document.querySelector('#legend');legend.replaceChildren();(args.actors||[]).forEach((a,i)=>{let label=document.createElement('span');label.textContent=(i+1)+'. '+a.name;label.style.color=a.enemy?'#ed9daa':'#91c5a6';legend.append(label)});send('streamlit:setFrameHeight',{height:document.body.scrollHeight})});window.onresize=()=>{draw();send('streamlit:setFrameHeight',{height:document.body.scrollHeight})};send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:490});
</script></html>
